# Construit l'APK Android signée et la publie en Release (suivie par Obtainium).
# Une Release par version : le numéro est celui de VERSION dans app.js.
# Sur une pull request : simple construction de contrôle (APK de test non signée), sans Release.
name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          V=$(sed -n "s/^const VERSION = '\([0-9.]*\)';.*/\1/p" app.js)
          [ -n "$V" ] || { echo "VERSION introuvable dans app.js"; exit 1; }
          IFS=. read -r A B C <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((A*10000 + B*100 + ${C:-0}))" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "exists=pr" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Release v$V déjà publiée"; fi

      - name: Mot de passe de la clé
        if: steps.v.outputs.exists == ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD absent (Settings > Secrets and variables > Actions)"; exit 1; }

      - uses: actions/setup-java@v4
        if: steps.v.outputs.exists != '1'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists != '1'
        with:
          node-version: '22'

      - name: Appli web -> projet Android
        if: steps.v.outputs.exists != '1'
        run: |
          npm ci
          npm run sync

      - name: Construction de l'APK
        if: steps.v.outputs.exists != '1'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.v.outputs.exists }}" = "pr" ]; then
            ./gradlew --no-daemon assembleDebug -PappVersionName=${{ steps.v.outputs.name }} -PappVersionCode=${{ steps.v.outputs.code }}
            cp app/build/outputs/apk/debug/app-debug.apk ../scan-livrets-test.apk
            exit 0
          fi
          ./gradlew --no-daemon assembleRelease -PappVersionName=${{ steps.v.outputs.name }} -PappVersionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk ../scan-livrets-v${{ steps.v.outputs.name }}.apk

      - name: Release
        if: steps.v.outputs.exists == ''
        run: |
          V=${{ steps.v.outputs.name }}
          gh release create "v$V" "scan-livrets-v$V.apk" --target "$GITHUB_SHA" --title "Scan Livrets $V" \
            --notes "$(git log -1 --format=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')"

      - name: APK de test
        if: steps.v.outputs.exists == 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: scan-livrets-test
          path: scan-livrets-test.apk
